    - DeployADF
    - DeployDatabricks
    - DeploySQL
  condition: |
    and(
      in(dependencies.PreDeploymentValidation.result, 'Succeeded'),
      or(
        in(dependencies.DeployADF.result, 'Succeeded', 'Skipped'),
        in(dependencies.DeployDatabricks.result, 'Succeeded', 'Skipped'),
        in(dependencies.DeploySQL.result, 'Succeeded', 'Skipped')
      )
    )
  pool:
    vmImage: 'ubuntu-latest'
  
  steps:
  - task: UsePythonVersion@0
    displayName: 'Use Python 3.10'
    inputs:
