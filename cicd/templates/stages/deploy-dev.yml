# ============================================================================
# DEV Deployment Stage Template
# ============================================================================
# Automated deployment to DEV environment
# Includes smoke tests and validation
# ============================================================================

parameters:
- name: environment
  type: string
  default: 'DEV'
- name: artifactName
  type: string
- name: serviceConnection
  type: string
- name: resourceGroup
  type: string
- name: adfChanged
  type: string
  default: 'false'
- name: databricksChanged
  type: string
  default: 'false'
- name: sqlChanged
  type: string
  default: 'false'
- name: terraformChanged
  type: string
  default: 'false'

jobs:

# ============================================================================
# JOB 1: Pre-Deployment Validation
# ============================================================================
- job: PreDeploymentValidation
  displayName: 'Pre-Deployment Validation'
  pool:
    vmImage: 'ubuntu-latest'
  
  steps:
  - download: current
    artifact: '${{ parameters.artifactName }}'
    displayName: 'Download Build Artifacts'
  
  - script: |
      echo "============================================"
      echo "Pre-Deployment Validation - ${{ parameters.environment }}"
      echo "============================================"
      echo "Artifact: ${{ parameters.artifactName }}"
      echo "Environment: ${{ parameters.environment }}"
      echo "============================================"
      
      # Verify artifact integrity
      cd $(Pipeline.Workspace)/${{ parameters.artifactName }}
      
      if [ -f "checksums.txt" ]; then
        echo "Verifying artifact checksums..."
        sha256sum -c checksums.txt
        if [ $? -eq 0 ]; then
          echo "✓ Artifact integrity verified"
        else
          echo "✗ Artifact integrity check failed"
          exit 1
        fi
      fi
      
      # Display version information
      if [ -f "version.txt" ]; then
        echo ""
        echo "Version Information:"
        cat version.txt
      fi
      
      # Display build manifest
      if [ -f "build-manifest.json" ]; then
        echo ""
        echo "Build Manifest:"
        cat build-manifest.json
      fi
    displayName: 'Verify Artifact Integrity'

# ============================================================================
# JOB 2: Deploy Terraform Infrastructure
# ============================================================================
- job: DeployTerraform
  displayName: 'Deploy Terraform Infrastructure'
  dependsOn: PreDeploymentValidation
  condition: and(succeeded(), eq('${{ parameters.terraformChanged }}', 'true'))
  pool:
    vmImage: 'ubuntu-latest'
  
  steps:
  - download: current
    artifact: '${{ parameters.artifactName }}'
    displayName: 'Download Artifacts'
  
  - task: TerraformInstaller@0
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: 'latest'
  
  - task: AzureCLI@2
    displayName: 'Terraform Plan'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        cd $(Pipeline.Workspace)/${{ parameters.artifactName }}/terraform/environments/dev
        
        terraform init \
          -backend-config="resource_group_name=${{ parameters.resourceGroup }}" \
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
          -backend-config="container_name=tfstate" \
          -backend-config="key=dev.terraform.tfstate"
        
        terraform plan -out=tfplan
  
  - task: AzureCLI@2
    displayName: 'Terraform Apply'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        cd $(Pipeline.Workspace)/${{ parameters.artifactName }}/terraform/environments/dev
        terraform apply -auto-approve tfplan

# ============================================================================
# JOB 3: Deploy Azure Data Factory
# ============================================================================
- job: DeployADF
  displayName: 'Deploy Azure Data Factory'
  dependsOn: 
    - PreDeploymentValidation
    - DeployTerraform
  condition: |
    and(
      in(dependencies.PreDeploymentValidation.result, 'Succeeded'),
      or(
        in(dependencies.DeployTerraform.result, 'Succeeded', 'Skipped'),
        eq('${{ parameters.terraformChanged }}', 'false')
      ),
      eq('${{ parameters.adfChanged }}', 'true')
    )
  pool:
    vmImage: 'ubuntu-latest'
  
  steps:
  - download: current
    artifact: '${{ parameters.artifactName }}'
    displayName: 'Download Artifacts'
  
  - task: NodeTool@0
    displayName: 'Install Node.js'
    inputs:
      versionSpec: '16.x'
  
  - task: AzurePowerShell@5
    displayName: 'Stop ADF Triggers'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      ScriptType: 'InlineScript'
      Inline: |
        $adfName = "$(DEV_ADF_NAME)"
        $rgName = "${{ parameters.resourceGroup }}"
        
        Write-Host "Stopping triggers in ADF: $adfName"
        $triggers = Get-AzDataFactoryV2Trigger -ResourceGroupName $rgName -DataFactoryName $adfName
        
        foreach($trigger in $triggers) {
          if($trigger.RuntimeState -eq "Started") {
            Write-Host "Stopping trigger: $($trigger.Name)"
            Stop-AzDataFactoryV2Trigger -ResourceGroupName $rgName -DataFactoryName $adfName -Name $trigger.Name -Force
          }
        }
      azurePowerShellVersion: 'LatestVersion'
  
  - task: AzureResourceManagerTemplateDeployment@3
    displayName: 'Deploy ADF ARM Template'
    inputs:
      deploymentScope: 'Resource Group'
      azureResourceManagerConnection: '${{ parameters.serviceConnection }}'
      subscriptionId: '$(AZURE_SUBSCRIPTION_ID)'
      action: 'Create Or Update Resource Group'
      resourceGroupName: '${{ parameters.resourceGroup }}'
      location: '$(AZURE_LOCATION)'
      templateLocation: 'Linked artifact'
      csmFile: '$(Pipeline.Workspace)/${{ parameters.artifactName }}/adf/ARMTemplateForFactory.json'
      csmParametersFile: '$(Pipeline.Workspace)/${{ parameters.artifactName }}/adf/ARMTemplateParametersForFactory.json'
      deploymentMode: 'Incremental'
  
  - task: AzurePowerShell@5
    displayName: 'Start ADF Triggers'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      ScriptType: 'InlineScript'
      Inline: |
        $adfName = "$(DEV_ADF_NAME)"
        $rgName = "${{ parameters.resourceGroup }}"
        
        Write-Host "Starting triggers in ADF: $adfName"
        $triggers = Get-AzDataFactoryV2Trigger -ResourceGroupName $rgName -DataFactoryName $adfName
        
        foreach($trigger in $triggers) {
          Write-Host "Starting trigger: $($trigger.Name)"
          Start-AzDataFactoryV2Trigger -ResourceGroupName $rgName -DataFactoryName $adfName -Name $trigger.Name -Force
        }
      azurePowerShellVersion: 'LatestVersion'

# ============================================================================
# JOB 4: Deploy Databricks
# ============================================================================
- job: DeployDatabricks
  displayName: 'Deploy Databricks Assets'
  dependsOn: 
    - PreDeploymentValidation
    - DeployTerraform
  condition: |
    and(
      in(dependencies.PreDeploymentValidation.result, 'Succeeded'),
      or(
        in(dependencies.DeployTerraform.result, 'Succeeded', 'Skipped'),
        eq('${{ parameters.terraformChanged }}', 'false')
      ),
      eq('${{ parameters.databricksChanged }}', 'true')
    )
  pool:
    vmImage: 'ubuntu-latest'
  
  steps:
  - download: current
    artifact: '${{ parameters.artifactName }}'
    displayName: 'Download Artifacts'
  
  - task: UsePythonVersion@0
    displayName: 'Use Python 3.10'
    inputs:
      versionSpec: '3.10'
  
  - script: |
      echo "Installing Databricks CLI..."
      pip install databricks-cli
    displayName: 'Install Databricks CLI'
  
  - task: AzureCLI@2
    displayName: 'Configure Databricks'
    inputs:
      azureSubscription: '${{ parameters.serviceConnection }}'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        # Get Databricks token using Azure CLI
        DATABRICKS_TOKEN=$(az account get-access-token --resource 2ff814a6-3304-4ab8-85cb-cd0e6f879c1d --query accessToken -o tsv)
        
        echo "DATABRICKS_HOST=$(DEV_DATABRICKS_HOST)" >> $GITHUB_ENV
        echo "DATABRICKS_TOKEN=$DATABRICKS_TOKEN" >> $GITHUB_ENV
  
  - script: |
      echo "Deploying Databricks notebooks..."
      cd $(Pipeline.Workspace)/${{ parameters.artifactName }}/databricks
      
      # Deploy notebooks
      if [ -d "notebooks" ]; then
        databricks workspace import_dir \
          --overwrite \
          notebooks \
          /Shared/DataEngineering/notebooks
        echo "Notebooks deployed successfully"
      fi
    displayName: 'Deploy Databricks Notebooks'
    env:
      DATABRICKS_HOST: $(DEV_DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)
  
  - script: |
      echo "Deploying Databricks workflows..."
      cd $(Pipeline.Workspace)/${{ parameters.artifactName }}/databricks
      
      # Deploy workflows using Databricks CLI or API
      if [ -d "workflows" ]; then
        for workflow in workflows/*.json; do
          echo "Deploying workflow: $workflow"
          # Add workflow deployment logic
        done
      fi
    displayName: 'Deploy Databricks Workflows'
    env:
      DATABRICKS_HOST: $(DEV_DATABRICKS_HOST)
      DATABRICKS_TOKEN: $(DATABRICKS_TOKEN)

# ============================================================================
